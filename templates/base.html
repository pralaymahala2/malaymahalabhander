<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ store_name }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('home') }}">{{ store_name }}</a><nav><a href="{{ url_for('home') }}">Shop</a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header><main>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>Store demo • Online payments are not active until gateway setup and verification.</footer></body></html>
